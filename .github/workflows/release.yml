name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          pip install -e ".[pdf]"
          python -m playwright install --with-deps chromium

      - name: Check and build
        run: |
          lamh check
          lamh pdf --no-preview

      - name: Publish the release with the PDF attached
        uses: softprops/action-gh-release@v2
        with:
          files: dist/less-admin-more-human.pdf
          generate_release_notes: true
